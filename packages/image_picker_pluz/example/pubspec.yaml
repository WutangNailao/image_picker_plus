name: image_picker_example
description: Demonstrates how to use the image_picker plugin.
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.1
  image_picker_pluz: ^0.0.4
  image_picker_plus_platform_interface: ^0.0.3
  mime: ^1.0.4
  video_player: ^2.7.0

dev_dependencies:
  build_runner: ^2.1.10
  espresso: ^0.4.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
